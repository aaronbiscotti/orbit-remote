name: Build Orbit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Test native SIMD & UAC takeover engine
        run: dotnet run --project tests/Orbit.Tests -c Release
      - name: Build native Windows engine
        run: dotnet publish host/Orbit.Host -c Release -r win-x64 --self-contained true -o dist/Orbit-Host
      - name: Install Electron dependencies
        run: npm install
      - name: Smoke test Electron app
        run: npm run smoke
      - name: Build Windows Electron Installer (Setup.exe & ZIP)
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Installer
          path: |
            dist/electron/*.exe
            dist/electron/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Prepare engine placeholder for macOS bundle
        run: mkdir -p dist/Orbit-Host
      - name: Install Electron dependencies
        run: npm install
      - name: Smoke test Electron app
        run: npm run smoke
      - name: Build Universal macOS Electron Installer (.dmg & .zip)
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-Installer
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
          if-no-files-found: error
